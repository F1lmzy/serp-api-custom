[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-aio-scraper"
version = "0.1.0"
description = "A small Google AI Overview scraper"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "playwright>=1.45,<2"]

[project.scripts]
google-aio = "aio_scraper:main"
google-aio-supabase = "run_supabase_batch:main"

[tool.setuptools]
py-modules = ["aio_scraper", "supabase_results", "run_supabase_batch"]
